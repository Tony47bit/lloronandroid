name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets (www)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Force landscape + fullscreen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' "$STYLES"
          grep -n "screenOrientation" "$MANIFEST"
          grep -n "windowFullscreen" "$STYLES"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
